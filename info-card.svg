<svg xmlns="http://www.w3.org/2000/svg" width="490" height="370" viewBox="0 0 490 370">
  <style>
    .bg { fill: #0d1117; rx: 8px; }
    .border { fill: none; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
    .term-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #c9d1d9; }
    .label { fill: #8b949e; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" class="border" />
  
  <!-- Terminal Top Window Controls -->
